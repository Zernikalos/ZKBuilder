syntax = "proto2";

package Zko;

import "./math.proto";

message ZkCamera {
  // --- ZObject (1-9) ---
  required string id = 1;
  required string name = 2;
  required ZkTransform transform = 3;
  optional ZkBounds bounds = 4;

  // --- ZCamera (10+) ---
  required ZkLens lens = 10;
}

message ZkLens {
  required float near = 1;
  required float far = 2;

  optional float aspectRatio = 3;
  optional float fov = 4;
}
