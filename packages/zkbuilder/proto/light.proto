syntax = "proto2";

package Zko;

import "./math.proto";

enum ZkLightType {
  DIRECTIONAL = 0;
  POINT = 1;
  SPOT = 2;
  AMBIENT = 3;
}

message ZkLight {
  // --- ZObject (1-9) ---
  required string id = 1;
  required string name = 2;
  required ZkTransform transform = 3;
  optional ZkBounds bounds = 4;

  // --- ZLight (10+) ---
  required ZkColor color = 10;
  required float intensity = 11;

  // Polymorphic lamp payload (engine field 12). Distinct oneof tags for each lamp kind.
  oneof lamp {
    ZkDirectionalLamp directionalLamp = 12;
    ZkPointLamp pointLamp = 13;
    ZkSpotLamp spotLamp = 14;
    ZkAmbientLamp ambientLamp = 15;
  }

  // Future: shadows
  // optional ZkShadowSettings shadow = 20;
}

message ZkDirectionalLamp {
  required ZkLightType lampType = 1;
}

message ZkAmbientLamp {
  required ZkLightType lampType = 1;
}

message ZkPointLamp {
  required ZkLightType lampType = 1;
  optional float range = 2;
  optional float decay = 3;
}

message ZkSpotLamp {
  required ZkLightType lampType = 1;
  optional float range = 2;
  optional float decay = 3;
  optional float innerAngle = 4;
  optional float outerAngle = 5;
}

