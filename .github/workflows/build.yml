# GitHub Action for ZKBuilder CI

name: Build Project

# Controls when the action will run. 
on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: [ main ]

  # Triggers the workflow on pull requests targeting the main branch
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # These permissions are crucial for accessing private packages
    permissions:
      contents: read
      packages: read # Allows reading packages from GitHub Packages within the organization

    # Required by setup-node@v7 when registry-url writes ${NODE_AUTH_TOKEN} into .npmrc
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    container:
      image: node:24-alpine

    steps:
      # 1. Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Sets up pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      # 3. Sets up Node.js and configures it to use the GitHub Packages registry for the @zernikalos scope
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@zernikalos'

      # 4. Installs dependencies
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile

      # High: non-blocking (step shows yellow). Critical: fails the job.
      - name: Audit dependencies (high)
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: Audit dependencies (critical)
        run: pnpm audit --audit-level=critical

      # 5. Generate assets before building
      - name: Generate assets
        run: pnpm generate

      # 6. Runs the build script for all packages
      - name: Build project
        run: pnpm build