packages:
  - packages/zkbuilder
  - packages/zkbuilder-cli

managePackageManagerVersions: true

# Supply chain protection (pnpm 11 defaults; explicit for clarity)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@zernikalos/*'

blockExoticSubdeps: true
strictDepBuilds: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@zernikalos/*'
trustPolicyIgnoreAfter: 10080

verifyDepsBeforeRun: install

# Explicit lifecycle-script allowlist (strictDepBuilds defaults to true)
allowBuilds:
  protobufjs: true
  esbuild: false
  nx: false

# Temporary: lerna → nx still pulls vulnerable brace-expansion / js-yaml.
# Remove once lerna ships a fixed tree.
overrides:
  "brace-expansion@>=4.0.0 <5.0.9": "5.0.9"
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1"

# Temporary: ignore image-size security vulnerability
# Right now on the repo it is indicated it is a ai sloppy thing.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq